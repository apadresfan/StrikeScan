<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StrikeScan - Bowling Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [tab, setTab] = useState("bowlers");
      
      // Blank initial state
      const [leagues, setLeagues] = useState([]);
      const [selectedLeagueId, setSelectedLeagueId] = useState("");
      const [bowlers, setBowlers] = useState([]);
      const [scores, setScores] = useState([]); // [{id, bowlerId, leagueId, game1, game2, game3, series, date}]

      // Forms display toggles
      const [showAddLeague, setShowAddLeague] = useState(false);
      const [showAddBowler, setShowAddBowler] = useState(false);
      const [showAddScore, setShowAddScore] = useState(false);

      // Form inputs
      const [newLeagueName, setNewLeagueName] = useState("");
      const [newLeagueYear, setNewLeagueYear] = useState(new Date().getFullYear().toString());
      const [newBowlerName, setNewBowlerName] = useState("");

      // Score input state
      const [selectedBowlerForScore, setSelectedBowlerForScore] = useState("");
      const [g1, setG1] = useState("");
      const [g2, setG2] = useState("");
      const [g3, setG3] = useState("");

      // Add League
      const handleAddLeague = (e) => {
        e.preventDefault();
        if (!newLeagueName.trim()) return;
        const newLeague = {
          id: Date.now().toString(),
          name: newLeagueName.trim(),
          year: newLeagueYear.trim()
        };
        setLeagues([...leagues, newLeague]);
        setSelectedLeagueId(newLeague.id);
        setNewLeagueName("");
        setShowAddLeague(false);
      };

      // Add Bowler
      const handleAddBowler = (e) => {
        e.preventDefault();
        if (!newBowlerName.trim() || !selectedLeagueId) return;
        const newBowler = {
          id: Date.now().toString(),
          leagueId: selectedLeagueId,
          name: newBowlerName.trim()
        };
        setBowlers([...bowlers, newBowler]);
        setNewBowlerName("");
        setShowAddBowler(false);
      };

      // Record Scores (3-Game Series)
      const handleAddScore = (e) => {
        e.preventDefault();
        if (!selectedBowlerForScore || !selectedLeagueId) return;

        const game1 = parseInt(g1) || 0;
        const game2 = parseInt(g2) || 0;
        const game3 = parseInt(g3) || 0;
        const series = game1 + game2 + game3;

        const newScore = {
          id: Date.now().toString(),
          bowlerId: selectedBowlerForScore,
          leagueId: selectedLeagueId,
          game1, game2, game3,
          series,
          date: new Date().toLocaleDateString()
        };

        setScores([...scores, newScore]);
        setG1(""); setG2(""); setG3("");
        setShowAddScore(false);
      };

      // Calculate stats dynamically for a bowler in the current league
      const getBowlerStats = (bowlerId) => {
        const bowlerScores = scores.filter(s => s.bowlerId === bowlerId && s.leagueId === selectedLeagueId);
        if (bowlerScores.length === 0) {
          return { games: 0, totalPins: 0, avg: 0, highGame: 0, highSeries: 0, scoresList: [] };
        }

        let totalPins = 0;
        let gameCount = 0;
        let highGame = 0;
        let highSeries = 0;

        bowlerScores.forEach(s => {
          totalPins += s.series;
          gameCount += 3;
          highSeries = Math.max(highSeries, s.series);
          highGame = Math.max(highGame, s.game1, s.game2, s.game3);
        });

        const avg = gameCount > 0 ? Math.round(totalPins / gameCount) : 0;

        return {
          games: gameCount,
          totalPins,
          avg,
          highGame,
          highSeries,
          scoresList: bowlerScores
        };
      };

      const currentBowlers = bowlers.filter(b => b.leagueId === selectedLeagueId);

      return (
        <div class="max-w-md mx-auto space-y-5">
          {/* Header */}
          <header class="border-b border-slate-800 pb-3 flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold text-indigo-400">StrikeScan</h1>
              <p class="text-xs text-slate-400">League & Score Tracker</p>
            </div>
            <button 
              onClick={() => setShowAddLeague(!showAddLeague)}
              class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">
              + New League
            </button>
          </header>

          {/* Add League Form */}
          {showAddLeague && (
            <form onSubmit={handleAddLeague} class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
              <h3 class="text-sm font-bold text-white">Create New League</h3>
              <div>
                <label class="text-xs text-slate-400 block mb-1">League Name</label>
                <input 
                  type="text" 
                  required
                  placeholder="e.g. Pin Pals 2026"
                  value={newLeagueName}
                  onChange={(e) => setNewLeagueName(e.target.value)}
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>
              <div>
                <label class="text-xs text-slate-400 block mb-1">Season / Year</label>
                <input 
                  type="text" 
                  required
                  value={newLeagueYear}
                  onChange={(e) => setNewLeagueYear(e.target.value)}
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                />
              </div>
              <div class="flex gap-2 justify-end pt-1">
                <button type="button" onClick={() => setShowAddLeague(false)} class="px-3 py-1.5 text-xs text-slate-400">Cancel</button>
                <button type="submit" class="bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">Save League</button>
              </div>
            </form>
          )}

          {/* Select League */}
          {leagues.length > 0 ? (
            <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-800">
              <label class="text-xs text-slate-400 block mb-1 font-semibold">Active League</label>
              <select 
                value={selectedLeagueId}
                onChange={(e) => setSelectedLeagueId(e.target.value)}
                class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2 focus:outline-none">
                {leagues.map(l => (
                  <option key={l.id} value={l.id}>{l.name} ({l.year})</option>
                ))}
              </select>
            </div>
          ) : (
            <div class="bg-slate-800/40 p-4 rounded-xl border border-dashed border-slate-700 text-center">
              <p class="text-xs text-slate-400 mb-2">No leagues created yet.</p>
              <button onClick={() => setShowAddLeague(true)} class="text-xs font-semibold text-indigo-400 underline">
                + Create your first league
              </button>
            </div>
          )}

          {/* Navigation Tabs */}
          <div class="flex gap-2 bg-slate-800 p-1 rounded-xl">
            <button 
              onClick={() => setTab("bowlers")}
              class={`flex-1 py-2 text-xs font-semibold rounded-lg ${tab === 'bowlers' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>
              Bowlers & Stats
            </button>
            <button 
              onClick={() => setTab("scores")}
              class={`flex-1 py-2 text-xs font-semibold rounded-lg ${tab === 'scores' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>
              Enter Scores
            </button>
            <button 
              onClick={() => setTab("ocr")}
              class={`flex-1 py-2 text-xs font-semibold rounded-lg ${tab === 'ocr' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>
              Scan Scoreboard
            </button>
          </div>

          {/* TAB 1: BOWLERS & STATS */}
          {tab === 'bowlers' && (
            <div class="space-y-4">
              <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-300">Roster & Averages</h2>
                {selectedLeagueId && (
                  <button 
                    onClick={() => setShowAddBowler(!showAddBowler)}
                    class="bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 text-xs font-semibold px-2.5 py-1.5 rounded-lg">
                    + Add Bowler
                  </button>
                )}
              </div>

              {/* Add Bowler Form */}
              {showAddBowler && selectedLeagueId && (
                <form onSubmit={handleAddBowler} class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                  <h3 class="text-sm font-bold text-white">Add Bowler</h3>
                  <input 
                    type="text" 
                    required
                    placeholder="Bowler Name"
                    value={newBowlerName}
                    onChange={(e) => setNewBowlerName(e.target.value)}
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-indigo-500"
                  />
                  <div class="flex gap-2 justify-end">
                    <button type="button" onClick={() => setShowAddBowler(false)} class="px-3 py-1.5 text-xs text-slate-400">Cancel</button>
                    <button type="submit" class="bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">Save Bowler</button>
                  </div>
                </form>
              )}

              {/* Bowler List */}
              {!selectedLeagueId ? (
                <div class="bg-slate-800/30 p-6 rounded-xl text-center text-xs text-slate-500">
                  Select or create a league above.
                </div>
              ) : currentBowlers.length === 0 ? (
                <div class="bg-slate-800/30 p-6 rounded-xl text-center space-y-2">
                  <p class="text-xs text-slate-400">No bowlers in this league yet.</p>
                  <button onClick={() => setShowAddBowler(true)} class="text-xs font-semibold text-indigo-400 underline">
                    + Add first bowler
                  </button>
                </div>
              ) : (
                <div class="space-y-3">
                  {currentBowlers.map(b => {
                    const stats = getBowlerStats(b.id);
                    return (
                      <div key={b.id} class="bg-slate-800 p-4 rounded-xl border border-slate-700/50 space-y-2">
                        <div class="flex justify-between items-center">
                          <h3 class="font-bold text-base text-white">{b.name}</h3>
                          <div class="text-right">
                            <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Average</span>
                            <span class="text-xl font-extrabold text-emerald-400">{stats.avg}</span>
                          </div>
                        </div>

                        <div class="grid grid-cols-4 gap-2 pt-2 border-t border-slate-700/40 text-center text-xs">
                          <div class="bg-slate-900/60 p-2 rounded-lg">
                            <span class="text-[10px] text-slate-400 block">Games</span>
                            <span class="font-bold text-white">{stats.games}</span>
                          </div>
                          <div class="bg-slate-900/60 p-2 rounded-lg">
                            <span class="text-[10px] text-slate-400 block">Pins</span>
                            <span class="font-bold text-white">{stats.totalPins}</span>
                          </div>
                          <div class="bg-slate-900/60 p-2 rounded-lg">
                            <span class="text-[10px] text-slate-400 block">High Gm</span>
                            <span class="font-bold text-indigo-400">{stats.highGame || '-'}</span>
                          </div>
                          <div class="bg-slate-900/60 p-2 rounded-lg">
                            <span class="text-[10px] text-slate-400 block">High Ser</span>
                            <span class="font-bold text-indigo-400">{stats.highSeries || '-'}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* TAB 2: ENTER SCORES */}
          {tab === 'scores' && (
            <div class="space-y-4">
              <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-300">League Scores</h2>
                {currentBowlers.length > 0 && (
                  <button 
                    onClick={() => setShowAddScore(!showAddScore)}
                    class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">
                    + Record 3 Games
                  </button>
                )}
              </div>

              {/* Add Score Form */}
              {showAddScore && (
                <form onSubmit={handleAddScore} class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                  <h3 class="text-sm font-bold text-white">Record 3-Game Series</h3>
                  <div>
                    <label class="text-xs text-slate-400 block mb-1">Select Bowler</label>
                    <select 
                      required
                      value={selectedBowlerForScore}
                      onChange={(e) => setSelectedBowlerForScore(e.target.value)}
                      class="w-full bg-slate-900 border border-slate-700 text-white text-sm rounded-lg p-2">
                      <option value="">-- Choose Bowler --</option>
                      {currentBowlers.map(b => (
                        <option key={b.id} value={b.id}>{b.name}</option>
                      ))}
                    </select>
                  </div>

                  <div class="grid grid-cols-3 gap-2">
                    <div>
                      <label class="text-xs text-slate-400 block mb-1">Game 1</label>
                      <input 
                        type="number" min="0" max="300" required
                        value={g1} onChange={(e) => setG1(e.target.value)}
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white text-center font-bold"
                      />
                    </div>
                    <div>
                      <label class="text-xs text-slate-400 block mb-1">Game 2</label>
                      <input 
                        type="number" min="0" max="300" required
                        value={g2} onChange={(e) => setG2(e.target.value)}
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white text-center font-bold"
                      />
                    </div>
                    <div>
                      <label class="text-xs text-slate-400 block mb-1">Game 3</label>
                      <input 
                        type="number" min="0" max="300" required
                        value={g3} onChange={(e) => setG3(e.target.value)}
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white text-center font-bold"
                      />
                    </div>
                  </div>

                  <div class="flex gap-2 justify-end pt-2">
                    <button type="button" onClick={() => setShowAddScore(false)} class="px-3 py-1.5 text-xs text-slate-400">Cancel</button>
                    <button type="submit" class="bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg">Save Scores</button>
                  </div>
                </form>
              )}

              {/* Recent Scores List */}
              {scores.filter(s => s.leagueId === selectedLeagueId).length === 0 ? (
                <div class="bg-slate-800/30 p-6 rounded-xl text-center text-xs text-slate-400 space-y-2">
                  <p>No scores recorded for this league yet.</p>
                  {currentBowlers.length > 0 && (
                    <button onClick={() => setShowAddScore(true)} class="text-xs font-semibold text-indigo-400 underline">
                      + Enter first series
                    </button>
                  )}
                </div>
              ) : (
                <div class="space-y-2">
                  {scores.filter(s => s.leagueId === selectedLeagueId).reverse().map(s => {
                    const bowler = bowlers.find(b => b.id === s.bowlerId);
                    return (
                      <div key={s.id} class="bg-slate-800 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                        <div>
                          <p class="font-bold text-sm text-white">{bowler ? bowler.name : 'Unknown'}</p>
                          <p class="text-xs text-slate-400">G1: {s.game1} | G2: {s.game2} | G3: {s.game3}</p>
                          <span class="text-[10px] text-slate-500">{s.date}</span>
                        </div>
                        <div class="text-right">
                          <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Series</span>
                          <span class="text-lg font-bold text-indigo-400">{s.series}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* TAB 3: OCR SCOREBOARD SCAN */}
          {tab === 'ocr' && (
            <div class="bg-slate-800 rounded-xl p-6 text-center space-y-4 border border-slate-700/50">
              <h2 class="text-base font-bold text-white">Upload Scoreboard Photo</h2>
              <p class="text-xs text-slate-400">Take a photo of the overhead monitor on league night to record scores.</p>
              <label class="block w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold py-3 rounded-xl cursor-pointer shadow-lg transition">
                📷 Take Photo / Choose File
                <input type="file" class="hidden" accept="image/*" />
              </label>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StrikeScan - Bowling Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [tab, setTab] = useState("bowlers");
      const [bowlers, setBowlers] = useState([
        { id: 1, name: "Ronald Cook", games: 12, totalPins: 2460, avg: 205, highGame: 268 },
        { id: 2, name: "Shanna Cook", games: 12, totalPins: 2100, avg: 175, highGame: 215 }
      ]);

      return (
        <div class="max-w-md mx-auto space-y-6">
          <header class="border-b border-slate-800 pb-4 text-center">
            <h1 class="text-2xl font-bold text-indigo-400">StrikeScan</h1>
            <p class="text-xs text-slate-400">League & Score Tracker</p>
          </header>

          <div class="flex gap-2 bg-slate-800 p-1 rounded-xl">
            <button 
              onClick={() => setTab("bowlers")}
              class={`flex-1 py-2 text-xs font-semibold rounded-lg ${tab === 'bowlers' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>
              Bowler Stats
            </button>
            <button 
              onClick={() => setTab("ocr")}
              class={`flex-1 py-2 text-xs font-semibold rounded-lg ${tab === 'ocr' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>
              Scan Scoreboard
            </button>
          </div>

          {tab === 'bowlers' && (
            <div class="bg-slate-800 rounded-xl p-4 space-y-3">
              <h2 class="text-sm font-bold text-slate-300">League Averages</h2>
              {bowlers.map(b => (
                <div key={b.id} class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700/50">
                  <div>
                    <p class="font-bold text-sm text-white">{b.name}</p>
                    <p class="text-xs text-slate-400">{b.games} games • High: {b.highGame}</p>
                  </div>
                  <div class="text-right">
                    <span class="text-xs text-slate-400">AVG</span>
                    <p class="text-lg font-extrabold text-emerald-400">{b.avg}</p>
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === 'ocr' && (
            <div class="bg-slate-800 rounded-xl p-6 text-center space-y-4">
              <h2 class="text-base font-bold text-white">Upload Scoreboard Photo</h2>
              <p class="text-xs text-slate-400">Take a direct picture of the overhead monitor from your phone camera.</p>
              <label class="block w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold py-3 rounded-xl cursor-pointer">
                📷 Take Photo or Select File
                <input type="file" class="hidden" accept="image/*" />
              </label>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
